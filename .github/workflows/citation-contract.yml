name: Citation reference contract (stdlib)

on:
  push:
    branches: [main]
    paths:
      - "app/evaluation/evaluators.py"
      - "tests/test_citation_contract_stdlib.py"
      - ".github/workflows/citation-contract.yml"
  pull_request:
    paths:
      - "app/evaluation/evaluators.py"
      - "tests/test_citation_contract_stdlib.py"
      - ".github/workflows/citation-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m py_compile app/evaluation/evaluators.py tests/test_citation_contract_stdlib.py
      - name: Run dependency-free reference tests
        run: python -m unittest discover -s tests -p "test_citation_contract_stdlib.py" -v
